version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # One combined PR per month. Needs a human merge: GitHub doesn't let
    # automation merge changes to workflow files.
    groups:
      actions:
        patterns: ["*"]
